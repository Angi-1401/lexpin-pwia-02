<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="A simple TailwindCSS project" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TailwindCSS</title>

    <!-- TailwindCSS | Universal Library -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- DaisyUI | Component Library (One among many of them) -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css" />

    <!-- FontAwesome -->
    <script
      src="https://kit.fontawesome.com/c640c833fe.js"
      crossorigin="anonymous"></script>
  </head>
  <body class="bg-gray-900 text-white h-screen">
    <div class="flex flex-col h-full">
      <header class="flex border-b border-b-white">Header</header>
      <div class="flex flex-1 gap-4 border border-green-500 overflow-hidden">
        <aside
          class="hidden md:flex md:flex-col md:border md:border-amber-500 md:p-4 md:h-full md:overflow-y-auto">
          <div
            class="flex flex-col justify-center items-center gap-2 p-4 border border-blue-500 lg:flex-row lg:justify-start lg:gap-2">
            <i class="fa-brands fa-youtube-shorts"></i>
            <span>Shorts</span>
          </div>
        </aside>
        <main class="flex flex-col border border-rose-500 p-4 h-full w-full">
          <section
            class="grid grid-cols-1 gap-4 overflow-y-auto md:grid-cols-2 lg:grid-cols-3">
            <div class="border border-purple-500 w-full h-50"></div>
            <div class="border border-purple-500 w-full h-50"></div>
            <div class="border border-purple-500 w-full h-50"></div>
            <div class="border border-purple-500 w-full h-50"></div>
            <div class="border border-purple-500 w-full h-50"></div>
            <div class="border border-purple-500 w-full h-50"></div>
            <div class="border border-purple-500 w-full h-50"></div>
            <div class="border border-purple-500 w-full h-50"></div>
          </section>
        </main>
      </div>
    </div>
  </body>
</html>
