<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="Control Panel Demo made with TailwindCSS" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Control Panel</title>

    <!-- TailwindCSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <script
      src="https://kit.fontawesome.com/c640c833fe.js"
      crossorigin="anonymous"></script>
    <!-- Flowbite -->
    <link
      href="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.css"
      rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.js"></script>
  </head>
  <body class="h-screen bg-slate-100 dark:bg-slate-800 dark:text-white">
    <div class="flex h-full">
      <aside
        class="hidden md:flex md:flex-col md:justify-between md:bg-slate-900 md:border-r md:border-slate-700 md:p-4 md:w-64 md:h-full md:sticky md:top-0 md:left-0 md:z-50">
        <div id="sidebar-navigation" class="flex flex-col gap-4 overflow-auto">
          <h1 class="text-2xl font-bold">Dashboard</h1>
          <hr class="border-slate-300 dark:border-slate-700" />
          <nav>
            <ul class="flex flex-col gap-4">
              <a href="#">
                <li
                  class="flex justify-start items-center gap-4 p-2 rounded bg-blue-400 dark:bg-blue-600">
                  <i class="fa-solid fa-house"></i>
                  Inicio
                </li>
              </a>
              <a href="#">
                <li
                  class="flex justify-start items-center gap-4 p-2 rounded border border-transparent hover:border-blue-400 dark:hover:border-blue-600">
                  <i class="fa-solid fa-user"></i>
                  Usuarios
                </li>
              </a>
              <a href="#">
                <li
                  class="flex justify-start items-center gap-4 p-2 rounded border border-transparent hover:border-blue-400 dark:hover:border-blue-600">
                  <i class="fa-solid fa-box"></i>
                  Productos
                </li>
              </a>
              <a href="#">
                <li
                  class="flex justify-start items-center gap-4 p-2 rounded border border-transparent hover:border-blue-400 dark:hover:border-blue-600">
                  <i class="fa-solid fa-cart-shopping"></i>
                  Pedidos
                </li>
              </a>
              <a href="#">
                <li
                  class="flex justify-start items-center gap-4 p-2 rounded border border-transparent hover:border-blue-400 dark:hover:border-blue-600">
                  <i class="fa-solid fa-chart-line"></i>
                  Reportes
                </li>
              </a>
              <a href="#">
                <li
                  class="flex justify-start items-center gap-4 p-2 rounded border border-transparent hover:border-blue-400 dark:hover:border-blue-600">
                  <i class="fa-solid fa-cog"></i>
                  Configuración
                </li>
              </a>
            </ul>
          </nav>
        </div>
        <div id="sidebar-profile" class="flex flex-col gap-4">
          <hr class="border-slate-300 dark:border-slate-700" />
          <div class="flex justify-between">
            <button>
              <img
                src="./img/profile.jpg"
                alt="Profile Picture"
                class="w-10 h-10 rounded-full" />
            </button>
            <button
              class="p-2 rounded hover:bg-slate-400 dark:hover:bg-slate-600">
              <i class="fa-solid fa-right-from-bracket"></i>
            </button>
          </div>
        </div>
      </aside>
      <div class="flex-1 overflow-hidden">
        <header
          class="flex justify-between items-center p-4 h-[70px] bg-slate-900 border-b border-slate-400 dark:border-slate-700 sticky top-0 z-50">
          <button
            class="p-2 rounded hover:bg-slate-400 dark:hover:bg-slate-600 md:hidden">
            <i class="fa-solid fa-bars"></i>
          </button>
          <input
            type="text"
            placeholder="Buscar..."
            class="hidden md:block md:p-2 md:w-[30%] md:rounded md:border md:border-slate-400 md:dark:border-slate-700 md:bg-slate-200 md:dark:bg-slate-800 md:text-slate-900 md:dark:text-slate-100" />
          <div class="flex gap-4">
            <button
              class="p-2 rounded hover:bg-slate-400 dark:hover:bg-slate-600 md:hidden">
              <i class="fa-solid fa-magnifying-glass"></i>
            </button>
            <button
              class="p-2 rounded hover:bg-slate-400 dark:hover:bg-slate-600">
              <i class="fa-solid fa-bell"></i>
            </button>
            <button
              class="p-2 rounded hover:bg-slate-400 dark:hover:bg-slate-600">
              <i class="fa-solid fa-comment"></i>
            </button>
            <button>
              <img
                src="./img/profile.jpg"
                alt="Profile Picture"
                class="w-10 h-10 rounded-full" />
            </button>
          </div>
        </header>
        <div class="overflow-auto h-full">
          <main>
            <div class="h-40 w-full border"></div>
            <div class="h-40 w-full border"></div>
            <div class="h-40 w-full border"></div>
            <div class="h-40 w-full border"></div>
            <div class="h-40 w-full border"></div>
            <div class="h-40 w-full border"></div>
            <div class="h-40 w-full border"></div>
            <div class="h-40 w-full border"></div>
            <div class="h-40 w-full border"></div>
          </main>
          <footer></footer>
        </div>
      </div>
    </div>
  </body>
</html>
