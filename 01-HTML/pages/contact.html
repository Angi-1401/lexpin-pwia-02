<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="A simple webpage demonstrating semantic HTML." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Semantic HTML</title>
  </head>
  <body>
    <header>
      <h1>Introduction to Semantic HTML</h1>
      <nav>
        <ul>
          <li><a href="./../index.html">Home</a></li>
          <li><a href="./about.html">About</a></li>
          <li><a href="./contact.html">Contact</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <aside>
        <h2>Sidebar</h2>
        <p>
          Use the navigation links above to explore different sections of the
          website.
        </p>
      </aside>
      <section>
        <h2>Contact Form</h2>
        <form action="#" method="post">
          <fieldset>
            <label for="first-name">First Name:</label>
            <input type="text" id="first-name" name="first-name" required />
            <label for="last-name">Last Name:</label>
            <input type="text" id="last-name" name="last-name" required />
          </fieldset>
          <fieldset>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required />
          </fieldset>
          <fieldset>
            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="4" cols="50">Enter your message here...</textarea>
          </fieldset>
          <input type="submit" value="Submit" />
        </form>
      </section>
      <section>
        <h2>Contact Information</h2>
        <p>
          You can reach us via email at
          <a href="mailto:info@example.com">info@example.com</a>.
        </p>
      </section>
    </main>
    <footer>
      <p>&copy; 2026 Semantic HTML Example</p>
    </footer>
  </body>
</html>
