<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="bg-gray-100 text-gray-900 dark:bg-gray-800 dark:text-white p-4">
    <div class="flex flex-col gap-4">
      <h1 class="text-2xl">To-Do List</h1>
      <form id="todo-form" class="flex flex-col gap-2">
        <label for="todo-input" class="text-sm">New Task</label>
        <div class="flex gap-4">
          <input
            type="text"
            id="todo-input"
            class="border border-blue-600 rounded-2xl px-4 py-2 focus:outline-none focus:ring-0"
            placeholder="Add a new task" />
          <button
            type="submit"
            id="create-todo"
            class="bg-blue-600 text-white rounded-2xl px-4 py-2 hover:bg-blue-700 focus:outline-none focus:ring-0 hover:cursor-pointer">
            Add Task
          </button>
        </div>
      </form>
      <h2>Pending Tasks</h2>
      <ul id="todo-list" class="bg-gray-200 p-4 rounded-lg dark:bg-gray-900">
        <!-- To-Do items will be appended here dynamically -->
      </ul>
      <h2>Completed Tasks</h2>
      <ul id="complete-todo-list" class="bg-gray-200 p-4 rounded-lg dark:bg-gray-900">
        <!-- To-Do items will be appended here dynamically -->
      </ul>
    </div>
    <script src="./main.js"></script>
  </body>
</html>
