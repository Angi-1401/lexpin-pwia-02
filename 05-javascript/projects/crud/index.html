<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="p-4 flex gap-2 w-full">
    <div>
      <h2 class="mb-2">Control</h2>
      <div class="flex gap-4">
        <label for="item">Item:</label>
        <input
          type="text"
          id="search-item"
          class="border"
          placeholder="Enter item to search" />
      </div>
      <p class="text-sm text-gray-500">
      </p>

      <div class="flex gap-4 mt-4">
        <label for="update-item">Update:</label>
        <input
          type="text"
          id="update-item"
          class="border"
          placeholder="Update item"
          disabled />
      </div>

      <div class="flex gap-2">
        <button id="search" class="mt-4 border px-2 py-1">Search</button>
        <button id="add" class="mt-4 border px-2 py-1" disabled>Add</button>
        <button id="update" class="mt-4 border px-2 py-1" disabled>
          Update
        </button>
        <button id="delete" class="mt-4 border px-2 py-1" disabled>
          Delete
        </button>
      </div>
    </div>

    <div class="ml-4 w-full">
      <h2 class="mb-2">Items</h2>
      <ul id="item-list" class="w-full border p-2"></ul>
    </div>

    <script src="main.js"></script>
  </body>
</html>
