<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <div class="max-w-md mx-auto mt-10 p-4 border rounded">
      <input
        type="text"
        id="display"
        class="w-full p-2 border rounded mb-4"
        readonly />
      <div class="grid grid-cols-4 gap-2">
        <button class="p-2 border rounded">(</button>
        <button class="p-2 border rounded">)</button>
        <button class="p-2 border rounded">DEL</button>
        <button class="p-2 border rounded">AC</button>
        <button class="p-2 border rounded">7</button>
        <button class="p-2 border rounded">8</button>
        <button class="p-2 border rounded">9</button>
        <button class="p-2 border rounded">/</button>
        <button class="p-2 border rounded">4</button>
        <button class="p-2 border rounded">5</button>
        <button class="p-2 border rounded">6</button>
        <button class="p-2 border rounded">*</button>
        <button class="p-2 border rounded">1</button>
        <button class="p-2 border rounded">2</button>
        <button class="p-2 border rounded">3</button>
        <button class="p-2 border rounded">-</button>
        <button class="p-2 border rounded">0</button>
        <button class="p-2 border rounded">.</button>
        <button class="p-2 border rounded">=</button>
        <button class="p-2 border rounded">+</button>
      </div>
    </div>

    <div id="demo"></div>

    <script src="main.js"></script>
  </body>
</html>
